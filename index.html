    <!-- Global error guard: never show a silent blank page -->
    <script>
      window.addEventListener("error", function (e) {
        var box = document.getElementById("boot-error");
        if (!box) {
          box = document.createElement("div");
          box.id = "boot-error";
          box.style.cssText =
            "position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#2a1215;color:#fda4af;border:1px solid #7f1d1d;padding:10px 14px;border-radius:10px;font:12px/1.5 monospace;white-space:pre-wrap";
          (document.body || document.documentElement).appendChild(box);
        }
        box.textContent = "⚠ " + (e.message || "Script error") + (e.filename ? "\n" + e.filename + ":" + e.lineno : "");
      });
    </script>
